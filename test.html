<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анимация стрелки</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f8fb;
  }

  .stage {
    width: 640px;
    max-width: 90vw;
  }

  svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .arrow-path {
    fill: none;
    stroke: #4d8cf5;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow-head {
    fill: none;
    stroke: #4d8cf5;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .replay-btn {
    display: block;
    margin: 24px auto 0;
    padding: 10px 22px;
    border: none;
    border-radius: 999px;
    background: #4d8cf5;
    color: #fff;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .replay-btn:hover {
    background: #3d78e0;
  }

  .replay-btn:active {
    transform: scale(0.96);
  }
</style>
</head>
<body>

<div class="stage">
  <svg viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
    <path
      id="linePath"
      class="arrow-path"
      d="M10,15
         C 120,-5 250,0 350,25
         C 430,45 500,80 555,120"
    />
    <path
      id="headPath"
      class="arrow-head"
      d="M535,110 L560,135 L580,105"
    />
  </svg>

  <button class="replay-btn" id="replayBtn">Повторить</button>
</div>

<script>
  const linePath = document.getElementById('linePath');
  const headPath = document.getElementById('headPath');
  const replayBtn = document.getElementById('replayBtn');

  const lineLength = linePath.getTotalLength();
  const headLength = headPath.getTotalLength();

  function setupDash(el, length) {
    el.style.strokeDasharray = length;
    el.style.strokeDashoffset = length;
  }

  function playAnimation() {
    setupDash(linePath, lineLength);
    setupDash(headPath, headLength);

    // force reflow so the reset above takes effect before animating
    linePath.getBoundingClientRect();

    const lineDuration = 1100; // ms
    const headDuration = 250;  // ms

    linePath.style.transition = `stroke-dashoffset ${lineDuration}ms ease`;
    headPath.style.transition = `stroke-dashoffset ${headDuration}ms ease`;
    headPath.style.transitionDelay = `${lineDuration - 80}ms`;

    requestAnimationFrame(() => {
      linePath.style.strokeDashoffset = '0';
      headPath.style.strokeDashoffset = '0';
    });
  }

  replayBtn.addEventListener('click', playAnimation);
  window.addEventListener('load', playAnimation);
</script>

</body>
</html>
